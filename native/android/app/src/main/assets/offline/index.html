    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f4f5f7;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
          Arial, sans-serif;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1989fa 0%, #0f6fd1 100%);
        z-index: 9999;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .splash-logo svg {
        width: 48px;
        height: 48px;
        fill: #fff;
      }
      .splash-loader {
        display: flex;
        gap: 6px;
        margin-bottom: 24px;
      }
      .splash-loader span {
        width: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: bounce 1.2s ease-in-out infinite;
      }
      .splash-loader span:nth-child(1) { animation-delay: 0s; }
      .splash-loader span:nth-child(2) { animation-delay: 0.15s; }
      .splash-loader span:nth-child(3) { animation-delay: 0.3s; }
      .splash-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        letter-spacing: 2px;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-12px); }
      }
    </style>
